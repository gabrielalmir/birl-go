name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build reproducible binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          suffix=""
          if [ "$GOOS" = windows ]; then suffix=".exe"; fi
          mkdir -p dist
          go build -trimpath -buildvcs=true \
            -ldflags="-s -w" \
            -o "dist/birl-${GOOS}-${GOARCH}${suffix}" .

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Scan, sign and release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Detect prompt-injection content
        run: python3 scripts/security/scan_prompt_injection.py .

      - name: Install and update ClamAV
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clamav
          # The package starts freshclam in the background. Stop it before the
          # explicit update so both processes do not contend for its log lock.
          sudo systemctl stop clamav-freshclam.service
          sudo freshclam --stdout

      - name: Scan release inputs for malware
        run: clamscan --recursive --infected --fail-if-cvd-older-than=7 .

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.10.0

      - name: Sign binaries with keyless OIDC identity
        shell: bash
        run: |
          for binary in dist/*; do
            cosign sign-blob --yes \
              --bundle "${binary}.sigstore.json" \
              "$binary"
          done

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum birl-* > SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
